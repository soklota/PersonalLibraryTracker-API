<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Influencer Simulator</title>
	<style>
		body {
			margin: 0;
			font-family: Arial, sans-serif;
			color: #1f2937;
			background: #f3f4f6;
		}

		main {
			max-width: 720px;
			margin: 12vh auto;
			padding: 3rem 2rem;
			text-align: center;
			background: white;
			border-radius: 16px;
			box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
		}

		h1 { margin-top: 0; color: #7c3aed; }
		p { line-height: 1.6; }
		a {
			display: inline-block;
			margin-top: 1rem;
			padding: 0.75rem 1.25rem;
			color: white;
			background: #7c3aed;
			border-radius: 8px;
			text-decoration: none;
		}
		a:hover { background: #6d28d9; }
	</style>
</head>
<body>
	<main>
		<h1>Influencer Simulator</h1>
		<p>Build your audience, create engaging content, and see how your influence grows.</p>
		<a href="#home" th:href="@{/home-page}">Start Simulation</a>
	</main>
</body>
</html>
